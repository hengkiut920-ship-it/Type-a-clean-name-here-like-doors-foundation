<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Doors Foundation Script Hub</title>
    <style>
        body {
            background-color: #121214;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;

        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #1a1a1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

            padding: 12px 24px;
            font-size: 16px;

            border-radius: 6px;

            transition: 0.3s;

        .btn:hover { background: #0088cc; }

<body>

<div class="container">
    <h1>🚪 Doors Ultimate Foundation</h1>

    <button class="btn" onclick="copyScript()">Copy Loadstring Script</button>

<script>
function copyScript() {
    const loadstring = 'loadstring(game:HttpGet("https://raw.githubusercontent.com/hengkiut92-ship-it/Type-a-clean-name-here-like-doors-foundation/main/Main.lua"))()';
